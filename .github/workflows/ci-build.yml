name: Build project

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional surefire -Dtest selector; empty runs the full suite'
        required: false
        default: ''

permissions:
  contents: read

env:
  MAVEN_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.http.retryhandler.count=5 -Dmaven.wagon.httpconnectionManager.ttlSeconds=240

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - setup: centos6-x86_64
            docker-compose-build: "-f docker/docker-compose.centos-6.yaml -f docker/docker-compose.centos-6.18.yaml build"
            docker-compose-run: "-f docker/docker-compose.centos-6.yaml -f docker/docker-compose.centos-6.18.yaml run build"
            artifact-paths: boringssl-static/target/netty-tcnative-boringssl-static-*-linux-x86_64.jar
          - setup: debian7-x86_64
            docker-compose-build: "-f docker/docker-compose.debian.yaml -f docker/docker-compose.debian-7.18.yaml build"
            docker-compose-run: "-f docker/docker-compose.debian.yaml -f docker/docker-compose.debian-7.18.yaml run build-dynamic-only"
            artifact-paths: ''
          - setup: centos7-aarch64
            docker-compose-build: "-f docker/docker-compose.centos-7.yaml build"
            docker-compose-run: "-f docker/docker-compose.centos-7.yaml run cross-compile-aarch64-build"
            artifact-paths: boringssl-static/target/netty-tcnative-boringssl-static-*-linux-aarch_64.jar

    name: ${{ matrix.setup }}
    steps:
      - uses: actions/checkout@v4

      # Cache .m2/repository
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: build-${{ matrix.setup }}-m2-repository-cache-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            build-${{ matrix.setup }}-m2-repository-cache-

      - name: Build docker image
        run: docker compose ${{ matrix.docker-compose-build }}

      - name: Build project
        env:
          MAVEN_OPTS: ${{ env.MAVEN_OPTS }}${{ inputs.test-filter != '' && format(' -Dtest={0} -Dsurefire.failIfNoSpecifiedTests=false', inputs.test-filter) || '' }}
        run: docker compose ${{ matrix.docker-compose-run }} | tee build.output

      - name: Checking for test failures
        run: ./.github/scripts/check_build_result.sh build.output

      - name: Upload native classifier jar
        if: ${{ matrix.artifact-paths != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: classifier-jar-${{ matrix.setup }}
          path: ${{ matrix.artifact-paths }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: build-${{ matrix.setup }}-target
          path: |
            **/target/surefire-reports/
            **/hs_err*.log


  build-windows:
    runs-on: windows-2022
    timeout-minutes: 50
    name: windows-x86_64
    steps:
      # Keep LF line endings: the LICENSE/NOTICE files and pom.xml are packaged into the jar verbatim.
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: zulu

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      # windows-2019 is retired; on windows-2022 select the VS 2019 (v142) toolset that vs2010.vcxproj.static.template
      # links with, so BoringSSL is compiled against the same STL (otherwise __std_find_trivial_1 is unresolved).
      - name: Configuring Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86_amd64
          toolset: 14.29

      - name: Install tools
        uses: crazy-max/ghaction-chocolatey@v3
        with:
          args: install ninja nasm

      # Cache .m2/repository
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: build-windows-m2-repository-cache-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            build-windows-m2-repository-cache-

      - name: Build netty-tcnative-boringssl-static
        run: ./mvnw.cmd --file pom.xml -am -pl boringssl-static clean package

      - name: Upload native classifier jar
        uses: actions/upload-artifact@v4
        with:
          name: classifier-jar-windows-x86_64
          path: boringssl-static/target/netty-tcnative-boringssl-static-*-windows-x86_64.jar
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: build-windows-target
          path: |
            **/target/surefire-reports/
            **/hs_err*.log

  # The osx-x86_64 / osx-aarch_64 jars are released from a Mac outside of GitHub Actions upstream;
  # build them natively here the same way the windows leg builds its jar.
  build-macos:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - setup: osx-x86_64
            os: macos-15-intel
          - setup: osx-aarch_64
            os: macos-latest

    name: ${{ matrix.setup }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: zulu

      - name: Install tools
        run: brew bundle --file=Brewfile

      # Cache .m2/repository
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: build-${{ matrix.setup }}-m2-repository-cache-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            build-${{ matrix.setup }}-m2-repository-cache-

      - name: Build netty-tcnative-boringssl-static
        run: ./mvnw --file pom.xml -am -pl boringssl-static clean package

      - name: Upload native classifier jar
        uses: actions/upload-artifact@v4
        with:
          name: classifier-jar-${{ matrix.setup }}
          path: boringssl-static/target/netty-tcnative-boringssl-static-*-${{ matrix.setup }}.jar
          if-no-files-found: error

  # The classifier-less jar is the uber-staging re-package (see boringssl-static/pom.xml) that depends on
  # every platform jar; upstream builds it on an osx-aarch_64 machine once all platform jars exist.
  build-uber:
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [build, build-windows, build-macos]
    name: uber-jar
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: zulu

      - name: Download native classifier jars
        uses: actions/download-artifact@v4
        with:
          pattern: classifier-jar-*
          path: classifier-jars
          merge-multiple: true

      - name: Install native classifier jars into the local repository
        run: |
          VERSION=$(./mvnw -q -N help:evaluate -Dexpression=project.version -DforceStdout)
          for c in linux-x86_64 linux-aarch_64 osx-x86_64 osx-aarch_64 windows-x86_64; do
            ./mvnw -B -N install:install-file -Dfile=classifier-jars/netty-tcnative-boringssl-static-$VERSION-$c.jar \
              -DgroupId=io.netty -DartifactId=netty-tcnative-boringssl-static -Dversion=$VERSION \
              -Dclassifier=$c -Dpackaging=jar -DgeneratePom=false
          done

      - name: Build netty-tcnative-boringssl-static uber jar
        run: ./mvnw -B --file pom.xml -am -pl boringssl-static -P uber-staging clean package -DstagingRepositoryId=none

      - name: Upload uber jar
        uses: actions/upload-artifact@v4
        with:
          name: uber-jar
          path: |
            boringssl-static/target/netty-tcnative-boringssl-static-*.jar
            !boringssl-static/target/netty-tcnative-boringssl-static-*-javadoc.jar
            !boringssl-static/target/netty-tcnative-boringssl-static-*-sources.jar
          if-no-files-found: error
